<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>The RATOX Player</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%;background:#0c1f2d;color:#f0f6ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    .player{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
    .player svg{width:96px;height:96px;filter:drop-shadow(0 8px 18px rgba(1,97,181,.5))}
    .player h1{font-size:1.4rem;margin:0;line-height:1.2}
    .player .by{color:#9db8d9;font-size:.9rem;margin:0}
    .play-btn{width:76px;height:76px;border-radius:50%;border:3px solid #38bdf8;background:#0161b5;color:#fff;font-size:1.7rem;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
    .play-btn:hover{background:#0277d6}
    .play-btn:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}
    .track{width:min(360px,86vw);height:10px;border-radius:999px;background:#1e3a5f;cursor:pointer;overflow:hidden}
    .fill{height:100%;width:0%;background:#38bdf8;border-radius:999px}
    .time{color:#9db8d9;font-size:.85rem;font-variant-numeric:tabular-nums}
    .open{color:#38bdf8;font-size:.9rem;text-decoration:none;font-weight:700}
    .open:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="player">
    <svg viewBox="0 0 64 64" role="img" aria-label="The RATOX Jukebox icon">
      <path d="M10 58V30a22 22 0 0 1 44 0v28z" fill="#0161b5" stroke="#38bdf8" stroke-width="2.5" />
      <path d="M16 30a16 16 0 0 1 32 0" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".7" />
      <rect x="20" y="20" width="24" height="9" rx="4.5" fill="#38bdf8" />
      <circle cx="24" cy="40" r="6.5" fill="#08131f" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="40" cy="40" r="6.5" fill="#08131f" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="24" cy="40" r="2.5" fill="#38bdf8" />
      <circle cx="40" cy="40" r="2.5" fill="#38bdf8" />
      <rect x="29" y="50" width="6" height="4" rx="1" fill="#f0f6ff" />
      <rect x="8" y="56" width="48" height="4" rx="2" fill="#0d1b31" stroke="#38bdf8" stroke-width="1" />
    </svg>
    <h1 id="song-title">The RATOX</h1>
    <p class="by">Ra Tod Musik — The RATOX Jukebox</p>
    <button class="play-btn" id="play-btn" aria-label="Play">▶</button>
    <div class="track" id="track"><div class="fill" id="fill"></div></div>
    <p class="time"><span id="cur">0:00</span> / <span id="dur">0:00</span></p>
    <a class="open" href="ratox.html" target="_blank" rel="noopener">Open the full jukebox ↗</a>
  </div>
  <audio id="audio" preload="metadata"></audio>
  <script>
    var SONGS = {
      "karma": {"title": "Karma", "file": "karma.mp3"},
      "wally-world": {"title": "Wally World", "file": "wally-world.mp3"},
      "we-have-machines": {"title": "We Have Machines", "file": "we-have-machines.mp3"},
      "hair-cut-hair": {"title": "Hair Cut Hair", "file": "hair-cut-hair.mp3"},
      "america-what-happened": {"title": "America What Happened", "file": "america-what-happened.mp3"},
      "you-buy-bobby": {"title": "You Buy Bobby", "file": "you-buy-bobby.mp3"},
      "wake-up": {"title": "Wake Up", "file": "wake-up.mp3"},
      "swivel": {"title": "SWIVEL", "file": "swivel.mp3"}
    };
    var params = new URLSearchParams(window.location.search);
    var key = params.get("song") || "karma";
    if (!SONGS[key]) key = "karma";
    var song = SONGS[key];
    var audio = document.getElementById("audio");
    var btn = document.getElementById("play-btn");
    var fill = document.getElementById("fill");
    var track = document.getElementById("track");
    var curEl = document.getElementById("cur");
    var durEl = document.getElementById("dur");
    document.getElementById("song-title").textContent = song.title;
    document.title = song.title + " — The RATOX";
    audio.src = "https://ratodmusik.github.io/ra-tod-musik/assets/songs/" + song.file;
    function fmt(s){ if(!isFinite(s)) return "0:00"; var m=Math.floor(s/60), ss=Math.floor(s%60); return m+":"+(ss<10?"0":"")+ss; }
    function setBtn(){ btn.textContent = audio.paused ? "▶" : "❚❚"; btn.setAttribute("aria-label", audio.paused ? "Play" : "Pause"); }
    btn.addEventListener("click", function(){
      if (audio.paused) { audio.play().catch(function(){}); } else { audio.pause(); }
    });
    audio.addEventListener("play", setBtn);
    audio.addEventListener("pause", setBtn);
    audio.addEventListener("loadedmetadata", function(){ durEl.textContent = fmt(audio.duration); });
    audio.addEventListener("timeupdate", function(){
      if (audio.duration) fill.style.width = (audio.currentTime / audio.duration * 100) + "%";
      curEl.textContent = fmt(audio.currentTime);
    });
    track.addEventListener("click", function(e){
      var r = track.getBoundingClientRect();
      var ratio = (e.clientX - r.left) / r.width;
      if (audio.duration) audio.currentTime = ratio * audio.duration;
    });
    if (params.get("autoplay") === "1" || params.get("auto_play") === "true") {
      audio.play().catch(function(){});
    }
  </script>
</body>
</html>
